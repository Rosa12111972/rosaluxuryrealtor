name: Probar mapa (temporal)
on:
  push:
    branches: [claude/spanish-page-spanish-compliance-s2sui3]
    paths: ['.github/workflows/probar-mapa.yml']
jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          import json
          d=[{'ref':f'T{i}','titulo':'Chalet','tipo':'Chalet','operacion':'Venta','precio':1000000,'zona':'Pozuelo','fotos':['img/col-villas.jpg'],'coords':[40.43+i*0.01,-3.79-i*0.01],'destacado':False} for i in range(5)]
          json.dump(d,open('propiedades.json','w'))
          PY
          (python3 -m http.server 8000 >/dev/null 2>&1 &)
          npm i -s playwright@1 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > t.js <<'JS'
          const { chromium } = require('playwright');
          (async()=>{
            const b = await chromium.launch(); const p = await b.newPage({viewport:{width:1300,height:900}});
            const e=[]; p.on('pageerror',x=>e.push(x.message));
            await p.goto('http://localhost:8000/propiedades.html'); await p.click('.ccb-reject');
            await p.click('[data-vista="mapa"]'); await p.waitForTimeout(4000);
            console.log('LEAFLET', await p.evaluate(()=>!!window.L), 'MARCADORES', await p.$$eval('.leaflet-interactive',x=>x.length), 'TILES', await p.$$eval('.leaflet-tile-loaded',x=>x.length), 'ERR', e);
            await p.goto('http://localhost:8000/propiedad.html?ref=T1'); await p.click('#verMapa'); await p.waitForTimeout(4000);
            console.log('FICHA LEAFLET', await p.evaluate(()=>!!window.L), 'CIRCULO', await p.$$eval('.leaflet-interactive',x=>x.length), 'TILES', await p.$$eval('.leaflet-tile-loaded',x=>x.length));
            await b.close();
          })();
          JS
          node t.js
