name: Inspeccionar XML de Inmovilla (temporal)
on:
  push:
    branches: [claude/spanish-page-spanish-compliance-s2sui3]
    paths: ['.github/workflows/inspeccionar-xml-inmovilla.yml']
jobs:
  inspeccionar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar XML de demostracion
        run: |
          curl -sSL -m 60 -o demo.xml https://procesos.inmovilla.com/xml/xml2demo/2-web.xml
          ls -la demo.xml
          file demo.xml
          head -c 1500 demo.xml; echo
      - name: Fotos y campos extra
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET, collections
          r = ET.parse('demo.xml').getroot()
          first_tags = [c.tag for c in r[0]]
          extra = collections.Counter()
          for p in r:
              for c in p:
                  if c.tag not in first_tags: extra[c.tag]+=1
          print('TAGS NO PRESENTES EN LA PRIMERA:', extra.most_common(60))
          con = [p for p in r if (p.findtext('numfotos') or '0') not in ('0','')]
          print('Con fotos:', len(con))
          if con:
              p = con[0]
              for c in p:
                  t=(c.text or '').strip()
                  if 'foto' in c.tag.lower() or 'http' in t or c.tag in ('ref','numfotos','accion','precioinmo','precioalq','tipo_ofer','ciudad','zona','energialetra','estadoficha','keyacci'):
                      print(c.tag,'=',t[:160])
          print('accion:', collections.Counter(p.findtext('accion') for p in r).most_common())
          print('energialetra:', collections.Counter(p.findtext('energialetra') for p in r).most_common())
          print('tipo_ofer:', collections.Counter(p.findtext('tipo_ofer') for p in r).most_common(15))
          PY
