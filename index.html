<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rosa Rodríguez</title>
<meta name="robots" content="noindex, nofollow">
<style>
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:#ffffff; color:#111; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
    text-align:center; padding:24px;
  }
  .box{ max-width:360px; }
  h1{ font-family:Georgia,serif; font-weight:400; font-size:22px; margin-bottom:10px; }
  p{ color:#777; font-size:14px; margin-bottom:28px; line-height:1.5; }
  input{
    width:100%; padding:12px 14px; border-radius:8px; border:1px solid #e5e1d8;
    background:#fcfcfb; color:#111; font-size:14px; margin-bottom:12px; text-align:center;
  }
  input:focus{ outline:none; border-color:#004225; }
  button{
    width:100%; padding:12px 14px; border-radius:8px; border:none;
    background:#004225; color:#fff; font-weight:600; font-size:14px; cursor:pointer;
  }
  button:hover{ background:#111; }
  .err{ color:#c0392b; font-size:12px; margin-top:10px; display:none; }
</style>
</head>
<body>
  <div class="box">
    <h1>Rosa Rodríguez</h1>
    <p>Esta web está en privado por ahora. Si tienes acceso, introduce el código.</p>
    <input type="password" id="pass" placeholder="Código de acceso" onkeydown="if(event.key==='Enter')entrar()">
    <button onclick="entrar()">Entrar</button>
    <div class="err" id="err">Código incorrecto, prueba otra vez.</div>
  </div>
  <script>
    function entrar(){
      const val = document.getElementById('pass').value.trim();
      if(val === 'rosa2026'){
        sessionStorage.setItem('rosaweb_ok', '1');
        window.location.href = 'app.html';
      } else {
        document.getElementById('err').style.display = 'block';
      }
    }
  </script>
</body>
</html>
